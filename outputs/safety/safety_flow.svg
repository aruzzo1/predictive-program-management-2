<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="760" viewBox="0 0 1040 760">
<rect width="1040" height="760" fill="#fcfcfb"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="24" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#0b0b0b" font-weight="600">Module 6 safety routing (deterministic; no LLM decides)</text>
<text x="24" y="56" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#52514e">Checks run top to bottom; the first that applies sets the route. Every route produces a human-review record with decision PENDING.</text>
<rect x="120" y="80" width="400" height="56" rx="8" fill="#f0efec" stroke="#0b0b0b" stroke-width="1.2"/>
<text x="320.0" y="104" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">Agent episode (structured trace)</text>
<text x="320.0" y="124" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="middle">status, validator categories, provenance, proposals</text>
<line x1="320.0" y1="136" x2="320.0" y2="170" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="120" y="170" width="400" height="60" rx="8" fill="#f0efec" stroke="#0b0b0b" stroke-width="1.2"/>
<text x="320.0" y="194" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">Output produced and status not FAILED?</text>
<line x1="520" y1="200" x2="640" y2="200" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/><text x="588.0" y="194.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#898781">no</text>
<rect x="640" y="165" width="370" height="70" rx="8" fill="#f0efec" stroke="#0b0b0b" stroke-width="1.2"/>
<text x="825.0" y="189" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">FAILED</text>
<text x="825.0" y="209" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="middle">provider / tool / schema / configuration failure</text>
<line x1="320.0" y1="230" x2="320.0" y2="270" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/><text x="328.0" y="244.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#898781">yes</text>
<rect x="120" y="270" width="400" height="72" rx="8" fill="#f0efec" stroke="#0b0b0b" stroke-width="1.2"/>
<text x="320.0" y="294" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">Any material failure? (G1-G7, G9)</text>
<text x="320.0" y="314" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="middle">validator categories, status, integrity,</text>
<text x="320.0" y="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="middle">frozen inputs, prohibited actions</text>
<line x1="520" y1="306" x2="640" y2="306" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/><text x="588.0" y="300.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#898781">yes</text>
<rect x="640" y="271" width="370" height="70" rx="8" fill="#f0efec" stroke="#0b0b0b" stroke-width="2"/>
<text x="825.0" y="295" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">BLOCKED_VALIDATION_FAILURE  [3 of 3 real episodes]</text>
<text x="825.0" y="315" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="middle">not usable downstream; raw output kept</text>
<line x1="320.0" y1="342" x2="320.0" y2="382" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/><text x="328.0" y="356.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#898781">no</text>
<rect x="120" y="382" width="400" height="60" rx="8" fill="#f0efec" stroke="#0b0b0b" stroke-width="1.2"/>
<text x="320.0" y="406" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">High-impact action proposed? (G8)</text>
<text x="320.0" y="426" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="middle">resequencing, production, resources, baseline</text>
<line x1="520" y1="412" x2="640" y2="412" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/><text x="588.0" y="406.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#898781">yes</text>
<rect x="640" y="377" width="370" height="70" rx="8" fill="#f0efec" stroke="#0b0b0b" stroke-width="1.2"/>
<text x="825.0" y="401" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">ESCALATE_HIGH_IMPACT</text>
<text x="825.0" y="421" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="middle">explicit human approval required</text>
<line x1="320.0" y1="442" x2="320.0" y2="482" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/><text x="328.0" y="456.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#898781">no</text>
<rect x="120" y="482" width="400" height="60" rx="8" fill="#f0efec" stroke="#0b0b0b" stroke-width="1.2"/>
<text x="320.0" y="506" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">Synthetic inputs / unresolved / conflicting evidence?</text>
<line x1="520" y1="512" x2="640" y2="512" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/><text x="588.0" y="506.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#898781">yes</text>
<rect x="640" y="477" width="370" height="70" rx="8" fill="#f0efec" stroke="#0b0b0b" stroke-width="1.2"/>
<text x="825.0" y="501" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">HUMAN_REVIEW_REQUIRED</text>
<text x="825.0" y="521" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="middle">valid analysis; human review before use</text>
<line x1="320.0" y1="542" x2="320.0" y2="590" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/><text x="328.0" y="560.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#898781">no</text>
<rect x="120" y="590" width="400" height="60" rx="8" fill="#f0efec" stroke="#0b0b0b" stroke-width="1.2"/>
<text x="320.0" y="614" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">SAFE_ADVISORY</text>
<text x="320.0" y="634" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="middle">display as advisory only; never authorizes implementation</text>
<rect x="640" y="590" width="370" height="70" rx="8" fill="#f0efec" stroke="#0b0b0b" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="825.0" y="614" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">Model confidence (logged, G10)</text>
<text x="825.0" y="634" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="middle">evaluation signal only; not an input</text>
<text x="825.0" y="650" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="middle">to any decision above</text>
<text x="24" y="720" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#52514e">Human review is required for every episode in the synthetic capstone, even when VALIDATED. Unsafe downstream releases of the three preserved real episodes: 0.</text>
</svg>
